version: "3.8"

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - internal
  deploy:
    resources:
      limits:
        memory: 2G
        cpus: "1.0"
      reservations:
        memory: 512M
        cpus: "0.25"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: kh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/logs:/var/log/nginx
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - internal
    depends_on:
      - tenant-a
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Let's Encrypt 证书自动获取和续期
  certbot:
    image: certbot/certbot:latest
    container_name: kh-certbot
    profiles:
      - ssl
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  tenant-a:
    <<: *app-common
    container_name: kh-tenant-a
    env_file:
      - ./deploy/tenants/tenant-a/.env
    volumes:
      - tenant-a-data:/app/data
    networks:
      internal:
        aliases:
          - tenant-a

volumes:
  tenant-a-data:
    driver: local
  certbot-www:
    driver: local
  certbot-conf:
    driver: local

networks:
  internal:
    driver: bridge
    internal: false
