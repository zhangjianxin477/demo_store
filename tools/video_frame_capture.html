<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #101216;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #101216;
    }
    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: 12px/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <video id="video" muted playsinline preload="auto"></video>
  <div id="status">loading</div>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    const time = Number(params.get('t') || 0);
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    video.src = src;
    video.addEventListener('loadedmetadata', () => {
      statusEl.textContent = `duration ${video.duration.toFixed(1)}s, seeking ${time}s`;
      video.currentTime = Math.min(Math.max(time, 0), Math.max(video.duration - 0.05, 0));
    });
    video.addEventListener('seeked', () => {
      video.pause();
      statusEl.textContent = `frame ${video.currentTime.toFixed(2)}s`;
      document.body.dataset.ready = 'true';
    });
    video.addEventListener('error', () => {
      statusEl.textContent = 'video error';
    });
  </script>
</body>
</html>
