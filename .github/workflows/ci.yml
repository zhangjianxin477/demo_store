name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements-lite.txt pytest
      - name: Compile backend
        run: python -m py_compile backend/app/main.py backend/app/api/routes.py
      - name: Run tests
        run: python -m pytest backend/tests -q

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check frontend/js/app.js
      - run: node --check browser-extension/background.js
