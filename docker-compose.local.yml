services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.free
    container_name: kh-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /app/data
      STORAGE_MODE: local
      EMBEDDING_LOCAL_ENABLED: "false"
      OCR_MODE: off
      LAYOUT_ANALYSIS_ENABLED: "false"
      TABLE_STRUCTURED_EXTRACTION: "false"
      IMAGE_EXTRACTION_ENABLED: "false"
      PYTHONPATH: /app/backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
